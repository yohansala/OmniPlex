<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalcBCV - Tasas Oficiales BCV</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f4f6">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: background 0.2s, color 0.2s; }
    body { background: #f3f4f6; color: #1f2937; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 420px; padding: 16px; display: flex; flex-direction: column; }
    
    /* HEADER */
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; }
    .action-btn-top { width: 42px; height: 42px; background: #fff; border: 1px solid #e5e7eb; color: #4b5563; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .action-btn-top:active { transform: scale(0.92); }
    .app-title-container { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 14px; border-radius: 20px; background: rgba(0, 102, 255, 0.08); }
    .app-title { font-size: 22px; font-weight: 800; color: #111827; }
    .refresh-spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* CARDS */
    .main-card, .rates-card, .history-card { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .bcv-button { background: #0066ff; color: #fff; font-weight: 700; font-size: 17px; padding: 12px; border-radius: 25px; text-align: center; width: 85%; margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,102,255,0.3); }
    .bcv-button:active { transform: scale(0.98); }

    /* MONTOS RÁPIDOS */
    .quick-amounts { display: flex; gap: 6px; margin-bottom: 16px; }
    .quick-btn { flex: 1; background: #f1f5f9; border: 1px solid #e2e8f0; color: #0066ff; font-weight: 700; font-size: 13px; padding: 8px 0; border-radius: 10px; cursor: pointer; }
    .quick-btn:active { background: #0066ff; color: #fff; }
    .clear-btn { background: #fef2f2; border-color: #fecaca; color: #ef4444; }
    .clear-btn:active { background: #ef4444; color: #fff; }

    /* INPUTS */
    .input-group { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding: 10px 0; margin-bottom: 8px; }
    .currency-label { font-size: 20px; font-weight: 700; width: 45px; }
    .currency-input { background: transparent; border: none; font-size: 20px; text-align: right; width: 100%; outline: none; font-weight: 600; padding-right: 10px; color: inherit; }
    .copy-btn { color: #888; background: none; border: none; cursor: pointer; }

    /* REPORTE & TASAS */
    .share-report-btn { margin-top: 12px; background: #22c55e; color: #fff; font-weight: 700; font-size: 14px; padding: 10px; border-radius: 12px; border: none; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
    .rates-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .rates-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: #888; font-weight: 700; }
    .update-time { font-size: 11px; color: #9ca3af; }
    .rates-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .rate-box { background: #f8fafc; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; }
    .rate-box:active { transform: scale(0.96); }
    .rate-name { font-size: 13px; color: #6b7280; font-weight: 600; }
    .rate-value { font-size: 16px; font-weight: 800; color: #0066ff; margin-top: 2px; }

    /* HISTORIAL */
    .history-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .history-item { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #e2e8f0; color: #4b5563; }
    .history-val { font-weight: 700; color: #111827; }

    /* MODO OSCURO */
    body.dark-mode { background: #000; color: #fff; }
    body.dark-mode .app-title { color: #fff; }
    body.dark-mode .action-btn-top { background: #1e1e1e; border-color: #333; color: #facc15; }
    body.dark-mode #clear-history-btn { color: #ef4444; }
    body.dark-mode .main-card, body.dark-mode .rates-card, body.dark-mode .history-card { background: #1a1a1a; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    body.dark-mode .quick-btn { background: #262626; border-color: #333; }
    body.dark-mode .clear-btn { background: #3f1d1d; border-color: #5c2424; color: #f87171; }
    body.dark-mode .input-group, body.dark-mode .history-item { border-bottom-color: #333; }
    body.dark-mode .rate-box { background: #222; border-color: #333; }
    body.dark-mode .history-val { color: #fff; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header-bar">
      <button class="action-btn-top" id="clear-history-btn" onclick="clearHistory()"><i data-lucide="trash-2" size="18"></i></button>
      <div class="app-title-container" onclick="fetchAllRates(true)">
        <h1 class="app-title">CalcBCV</h1>
        <i data-lucide="refresh-cw" size="18" id="refresh-icon" style="color:#0066ff"></i>
      </div>
      <button class="action-btn-top" onclick="toggleTheme()"><i data-lucide="moon" id="theme-icon"></i></button>
    </div>

    <div class="main-card">
      <div class="bcv-button" onclick="cycleCurrency()"><span id="bcv-button-text">Dólar BCV</span> <i data-lucide="arrow-left-right" size="18"></i></div>
      <div class="quick-amounts">
        <button class="quick-btn clear-btn" onclick="clearInput()">C</button>
        <button class="quick-btn" onclick="addAmount(1)">+1</button>
        <button class="quick-btn" onclick="addAmount(5)">+5</button>
        <button class="quick-btn" onclick="addAmount(10)">+10</button>
        <button class="quick-btn" onclick="addAmount(20)">+20</button>
        <button class="quick-btn" onclick="addAmount(50)">+50</button>
        <button class="quick-btn" onclick="addAmount(100)">+100</button>
      </div>
      <div class="input-group">
        <span class="currency-label" id="foreign-symbol">$</span>
        <input type="number" id="foreign-input" class="currency-input" value="1.00" step="any">
        <button class="copy-btn" onclick="copyValue('foreign-input')"><i data-lucide="copy" size="20"></i></button>
      </div>
      <div class="input-group">
        <span class="currency-label">Bs</span>
        <input type="number" id="bs-input" class="currency-input" value="883.40" step="any">
        <button class="copy-btn" onclick="copyValue('bs-input')"><i data-lucide="copy" size="20"></i></button>
      </div>
      <button class="share-report-btn" onclick="shareReport()"><i data-lucide="share-2" size="18"></i> Copiar Reporte WhatsApp</button>
    </div>

    <div class="rates-card">
      <div class="rates-header"><div class="rates-title">Tasas Oficiales BCV</div><div class="update-time" id="update-time">Actualizado</div></div>
      <div class="rates-grid">
        <div class="rate-box" onclick="setCurrency('USD')"><div class="rate-name">Dólar ($)</div><div class="rate-value" id="display-usd-rate">Bs. 883.40</div></div>
        <div class="rate-box" onclick="setCurrency('EUR')"><div class="rate-name">Euro (€)</div><div class="rate-value" id="display-eur-rate">Bs. 993.18</div></div>
        <div class="rate-box" onclick="setCurrency('CNY')"><div class="rate-name">Yuan (¥)</div><div class="rate-value" id="display-cny-rate">Bs. 132.30</div></div>
        <div class="rate-box" onclick="setCurrency('RUB')"><div class="rate-name">Rublo (₽)</div><div class="rate-value" id="display-rub-rate">Bs. 10.72</div></div>
      </div>
    </div>

    <div class="history-card">
      <div class="rates-title">Cálculos Recientes</div>
      <div class="history-list" id="history-list"><div class="history-item"><span>1.00 $</span><span class="history-val">883.40 Bs</span></div></div>
    </div>
  </div>

  <div id="toast" class="toast">Copiado al portapapeles</div>

  <script>
    lucide.createIcons();
    let rates = { USD: 883.3963, EUR: 993.1759, CNY: 132.2964, RUB: 10.7156 };
    let currentCurrency = 'USD', history = [];
    const currencyConfig = {
      USD: { name: "Dólar BCV", symbol: "$" },
      EUR: { name: "Euro BCV", symbol: "€" },
      CNY: { name: "Yuan BCV", symbol: "¥" },
      RUB: { name: "Rublo BCV", symbol: "₽" }
    };

    const foreignInput = document.getElementById('foreign-input'), bsInput = document.getElementById('bs-input');
    const foreignSymbol = document.getElementById('foreign-symbol'), bcvButtonText = document.getElementById('bcv-button-text');
    const updateTime = document.getElementById('update-time'), historyList = document.getElementById('history-list'), toast = document.getElementById('toast');

    function setCurrency(code) {
      currentCurrency = code;
      bcvButtonText.innerText = currencyConfig[code].name;
      foreignSymbol.innerText = currencyConfig[code].symbol;
      recalculateBs();
      showToast("Seleccionado: " + currencyConfig[code].name);
    }

    function cycleCurrency() {
      const keys = Object.keys(rates);
      setCurrency(keys[(keys.indexOf(currentCurrency) + 1) % keys.length]);
    }

    function addAmount(amount) {
      foreignInput.value = ((parseFloat(foreignInput.value) || 0) + amount).toFixed(2);
      recalculateBs();
    }

    function clearInput() { foreignInput.value = ''; bsInput.value = ''; foreignInput.focus(); }
    function clearHistory() { history = []; historyList.innerHTML = '<div class="history-item" style="justify-content:center; color:#9ca3af;">Sin historial</div>'; showToast("Historial borrado"); }

    function recalculateBs() {
      const val = parseFloat(foreignInput.value);
      if (!isNaN(val)) {
        const totalBs = (val * rates[currentCurrency]).toFixed(2);
        bsInput.value = totalBs;
        addHistory(val, totalBs, currencyConfig[currentCurrency].symbol);
      } else { bsInput.value = ''; }
    }

    function recalculateForeign() {
      const val = parseFloat(bsInput.value);
      if (!isNaN(val)) {
        const foreignTotal = (val / rates[currentCurrency]).toFixed(2);
        foreignInput.value = foreignTotal;
        addHistory(foreignTotal, val.toFixed(2), currencyConfig[currentCurrency].symbol);
      } else { foreignInput.value = ''; }
    }

    foreignInput.addEventListener('input', recalculateBs);
    bsInput.addEventListener('input', recalculateForeign);

    function addHistory(foreign, bs, symbol) {
      const itemText = `${foreign} ${symbol}`, bsText = `${bs} Bs`;
      if (history.length > 0 && history[0].foreign === itemText && history[0].bs === bsText) return;
      history.unshift({ foreign: itemText, bs: bsText });
      if (history.length > 3) history.pop();
      historyList.innerHTML = history.map(i => `<div class="history-item"><span>${i.foreign}</span><span class="history-val">${i.bs}</span></div>`).join('');
    }

    function shareReport() {
      const fVal = foreignInput.value || '0.00', bVal = bsInput.value || '0.00', sym = currencyConfig[currentCurrency].symbol;
      navigator.clipboard.writeText(`📝 *CalcBCV - Cotización*\n\n💵 *${fVal} ${sym}* = *${bVal} Bs*\n🏦 *Tasa Oficial:* ${rates[currentCurrency].toFixed(2)} Bs por ${sym}`);
      showToast("Reporte copiado para WhatsApp");
    }

    async function fetchAllRates(isManual = false) {
      const icon = document.getElementById('refresh-icon');
      if (isManual) { icon.classList.add('refresh-spin'); showToast("Actualizando tasas del BCV..."); }
      try {
        const res = await fetch('https://rates.dolarvzla.com/bcv/current.json');
        if (res.ok) {
          const data = await res.json();
          if (data.usd) rates.USD = parseFloat(data.usd);
          if (data.eur) rates.EUR = parseFloat(data.eur);
          if (data.cny) rates.CNY = parseFloat(data.cny);
          if (data.rub) rates.RUB = parseFloat(data.rub);
          
          document.getElementById('display-usd-rate').innerText = "Bs. " + rates.USD.toFixed(2);
          document.getElementById('display-eur-rate').innerText = "Bs. " + rates.EUR.toFixed(2);
          document.getElementById('display-cny-rate').innerText = "Bs. " + rates.CNY.toFixed(2);
          document.getElementById('display-rub-rate').innerText = "Bs. " + rates.RUB.toFixed(2);
          recalculateBs();
          updateTime.innerText = "Act: " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          if (isManual) showToast("¡Tasas actualizadas!");
        }
      } catch (e) { if (isManual) showToast("Error de conexión"); }
      finally { if (isManual) setTimeout(() => icon.classList.remove('refresh-spin'), 500); }
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchAllRates(false);
      updateTime.innerText = "Act: " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    });

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      document.getElementById('theme-icon').setAttribute('data-lucide', document.body.classList.contains('dark-mode') ? 'sun' : 'moon');
      lucide.createIcons();
    }

    function copyValue(id) {
      const input = document.getElementById(id);
      if (input.value) { navigator.clipboard.writeText(input.value); showToast("Copiado: " + input.value); }
    }

    function showToast(msg) {
      toast.innerText = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
